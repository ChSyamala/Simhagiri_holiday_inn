<script>
/* =========================================================
   SIMHAGIRI HOLIDAY INN - MAIN JAVASCRIPT
   ========================================================= */

document.addEventListener("DOMContentLoaded", function () {

  /* ---------- Lucide Icons ---------- */
  if (window.lucide) {
    lucide.createIcons();
  }


  /* =========================================================
     GALLERY
     ========================================================= */

  const galleryImages = [
    { src: "images/hero-hallway.jpg", cat: "living", label: "Living Space" },
    { src: "images/property-bed-window.jpg", cat: "bedroom", label: "Bedroom" },
    { src: "images/bedroom-1.jpg", cat: "bedroom", label: "Bedroom" },
    { src: "images/bedroom-2.jpg", cat: "bedroom", label: "Bedroom" },
    { src: "images/bedroom-3.jpg", cat: "bedroom", label: "Bedroom" },
    { src: "images/bedroom-4.jpg", cat: "bedroom", label: "Bedroom" },

    { src: "images/bathroom-1.jpg", cat: "bathroom", label: "Bathroom" },
    { src: "images/bathroom-2.jpg", cat: "bathroom", label: "Bathroom" },
    { src: "images/bathroom-3.jpg", cat: "bathroom", label: "Bathroom" },
    { src: "images/bathroom-4.jpg", cat: "bathroom", label: "Bathroom" },

    { src: "images/kitchen-1.jpg", cat: "kitchen", label: "Kitchen" },
    { src: "images/kitchen-2.jpg", cat: "kitchen", label: "Kitchen" },
    { src: "images/kitchen-3.jpg", cat: "kitchen", label: "Kitchen" },

    { src: "images/dining-1.jpg", cat: "dining", label: "Dining Area" },
    { src: "images/dining-2.jpg", cat: "dining", label: "Dining Area" },

    { src: "images/living-room-1.jpg", cat: "living", label: "Living Room" },
    { src: "images/living-room-2.jpg", cat: "living", label: "Living Room" },
    { src: "images/living-room-3.jpg", cat: "living", label: "Living Room" }
  ];

  const grid = document.getElementById("masonryGrid");

  function renderGallery(filter = "all") {

    if (!grid) return;

    grid.innerHTML = "";

    galleryImages.forEach((image, index) => {

      if (filter !== "all" && image.cat !== filter) {
        return;
      }

      const item = document.createElement("div");

      item.className = "gitem";
      item.tabIndex = 0;
      item.dataset.idx = index;

      item.innerHTML = `
        <img
          src="${image.src}"
          alt="${image.label} at Simhagiri Holiday Inn"
          loading="lazy"
        >

        <div class="gcap">
          ${image.label}
        </div>
      `;

      item.addEventListener("click", () => {
        openLightbox(index);
      });

      item.addEventListener("keydown", (event) => {
        if (event.key === "Enter" || event.key === " ") {
          event.preventDefault();
          openLightbox(index);
        }
      });

      grid.appendChild(item);
    });
  }

  renderGallery();


  /* ---------- Gallery Filters ---------- */

  const galleryTabs = document.getElementById("galleryTabs");

  if (galleryTabs) {

    galleryTabs.addEventListener("click", function (event) {

      const button = event.target.closest(".gtab");

      if (!button) return;

      document.querySelectorAll(".gtab").forEach(tab => {
        tab.classList.remove("active");
      });

      button.classList.add("active");

      renderGallery(button.dataset.filter);
    });
  }


  /* =========================================================
     LIGHTBOX
     ========================================================= */

  let lightboxIndex = 0;

  const lightbox = document.getElementById("lightbox");
  const lightboxImage = document.getElementById("lbImg");
  const lightboxCaption = document.getElementById("lbCap");

  function updateLightbox() {

    const image = galleryImages[lightboxIndex];

    if (!image) return;

    lightboxImage.src = image.src;
    lightboxImage.alt = image.label;

    lightboxCaption.textContent =
      `${image.label} — ${lightboxIndex + 1} / ${galleryImages.length}`;
  }

  window.openLightbox = function (index) {

    lightboxIndex = index;

    updateLightbox();

    lightbox.classList.add("open");

    document.body.style.overflow = "hidden";
  };

  function closeLightbox() {

    lightbox.classList.remove("open");

    document.body.style.overflow = "";
  }

  document.getElementById("lbClose")?.addEventListener(
    "click",
    closeLightbox
  );

  document.getElementById("lbPrev")?.addEventListener(
    "click",
    function () {

      lightboxIndex =
        (lightboxIndex - 1 + galleryImages.length) %
        galleryImages.length;

      updateLightbox();
    }
  );

  document.getElementById("lbNext")?.addEventListener(
    "click",
    function () {

      lightboxIndex =
        (lightboxIndex + 1) %
        galleryImages.length;

      updateLightbox();
    }
  );

  lightbox?.addEventListener("click", function (event) {

    if (event.target === lightbox) {
      closeLightbox();
    }
  });


  /* ---------- Keyboard controls ---------- */

  document.addEventListener("keydown", function (event) {

    if (!lightbox.classList.contains("open")) return;

    if (event.key === "Escape") {
      closeLightbox();
    }

    if (event.key === "ArrowLeft") {
      document.getElementById("lbPrev").click();
    }

    if (event.key === "ArrowRight") {
      document.getElementById("lbNext").click();
    }
  });


  /* =========================================================
     NAVIGATION
     ========================================================= */

  const nav = document.getElementById("siteNav");

  function updateNavigation() {

    if (!nav) return;

    if (window.scrollY > 60) {
      nav.classList.add("solid");
    } else {
      nav.classList.remove("solid");
    }
  }

  window.addEventListener(
    "scroll",
    updateNavigation,
    { passive: true }
  );

  updateNavigation();


  /* =========================================================
     MOBILE MENU
     ========================================================= */

  const mobileMenu = document.getElementById("mobileMenu");
  const hamburger = document.getElementById("hamburgerBtn");
  const mobileClose = document.getElementById("mobileCloseBtn");

  hamburger?.addEventListener("click", function () {
    mobileMenu.classList.add("open");
    document.body.style.overflow = "hidden";
  });

  mobileClose?.addEventListener("click", function () {
    mobileMenu.classList.remove("open");
    document.body.style.overflow = "";
  });

  mobileMenu?.querySelectorAll("a").forEach(link => {

    link.addEventListener("click", function () {

      mobileMenu.classList.remove("open");

      document.body.style.overflow = "";
    });
  });


  /* =========================================================
     SCROLL REVEAL
     ========================================================= */

  const revealElements =
    document.querySelectorAll(".reveal");

  if ("IntersectionObserver" in window) {

    const observer = new IntersectionObserver(
      function (entries) {

        entries.forEach(entry => {

          if (entry.isIntersecting) {

            entry.target.classList.add("in");

            observer.unobserve(entry.target);
          }
        });
      },
      {
        threshold: 0.12
      }
    );

    revealElements.forEach(element => {
      observer.observe(element);
    });

  } else {

    revealElements.forEach(element => {
      element.classList.add("in");
    });
  }


  /* =========================================================
     DATE SETTINGS
     ========================================================= */

  const today = new Date();

  const todayString =
    today.toISOString().split("T")[0];

  const tomorrow = new Date(today);

  tomorrow.setDate(
    tomorrow.getDate() + 1
  );

  const tomorrowString =
    tomorrow.toISOString().split("T")[0];

  const checkIn = document.getElementById("ci");
  const checkOut = document.getElementById("co");

  if (checkIn) {

    checkIn.min = todayString;

    if (!checkIn.value) {
      checkIn.value = todayString;
    }
  }

  if (checkOut) {

    checkOut.min = tomorrowString;

    if (!checkOut.value) {
      checkOut.value = tomorrowString;
    }
  }


  /* =========================================================
     BOOKING MODAL
     ========================================================= */

  const bookingModal =
    document.getElementById("bookingModal");

  const bookingForm =
    document.getElementById("bookingForm");

  const bookingFormWrap =
    document.getElementById("bookingFormWrap");

  const bookingConfirmWrap =
    document.getElementById("bookingConfirmWrap");


  window.openBooking = function () {

    bookingModal.classList.add("open");

    document.body.style.overflow = "hidden";

    syncBookingDates();
  };


  window.closeModal = function (id) {

    const modal = document.getElementById(id);

    if (!modal) return;

    modal.classList.remove("open");

    document.body.style.overflow = "";
  };


  function syncBookingDates() {

    const modalInputs =
      bookingForm?.querySelectorAll('input[type="date"]');

    if (!modalInputs || modalInputs.length < 2) {
      return;
    }

    modalInputs[0].value =
      checkIn?.value || todayString;

    modalInputs[1].value =
      checkOut?.value || tomorrowString;

    modalInputs[0].min = todayString;

    modalInputs[1].min =
      modalInputs[0].value || tomorrowString;
  }


  /* ---------- Keep checkout after checkin ---------- */

  checkIn?.addEventListener("change", function () {

    if (!checkOut) return;

    const selectedDate =
      new Date(this.value);

    selectedDate.setDate(
      selectedDate.getDate() + 1
    );

    const minimumCheckout =
      selectedDate.toISOString().split("T")[0];

    checkOut.min = minimumCheckout;

    if (
      !checkOut.value ||
      checkOut.value <= this.value
    ) {
      checkOut.value = minimumCheckout;
    }
  });


  /* =========================================================
     TOP BOOKING CARD
     ========================================================= */

  window.checkAvailability = function () {

    const checkInValue =
      document.getElementById("ci").value;

    const checkOutValue =
      document.getElementById("co").value;

    const guests =
      document.getElementById("guests").value;

    if (!checkInValue || !checkOutValue) {

      alert("Please select your check-in and check-out dates.");

      return;
    }

    if (checkOutValue <= checkInValue) {

      alert("Check-out must be after check-in.");

      return;
    }

    openBooking();

    const modalDates =
      bookingForm.querySelectorAll('input[type="date"]');

    modalDates[0].value = checkInValue;
    modalDates[1].value = checkOutValue;

    const guestSelect =
      bookingForm.querySelector("select");

    if (guestSelect) {
      guestSelect.value = guests;
    }
  };


  /* =========================================================
     BOOKING FORM
     ========================================================= */

  bookingForm?.addEventListener(
    "submit",
    function (event) {

      event.preventDefault();

      const dateInputs =
        bookingForm.querySelectorAll('input[type="date"]');

      const guestSelect =
        bookingForm.querySelector("select");

      const phoneInput =
        bookingForm.querySelector('input[type="tel"]');

      const nameInput =
        bookingForm.querySelector('input[type="text"]');

      const textarea =
        bookingForm.querySelector("textarea");


      const checkInDate =
        dateInputs[0].value;

      const checkOutDate =
        dateInputs[1].value;

      const guests =
        guestSelect.value;

      const phone =
        phoneInput.value.trim();

      const name =
        nameInput.value.trim();

      const message =
        textarea.value.trim();


      if (checkOutDate <= checkInDate) {

        alert("Check-out date must be after check-in date.");

        return;
      }


      /*
       * IMPORTANT:
       * Replace this email with the property's real email.
       */

      const propertyEmail =
        "EMAIL_HERE";


      if (propertyEmail === "EMAIL_HERE") {

        /*
         * Since the real email hasn't been provided,
         * we show the enquiry details instead of pretending
         * that the booking was sent.
         */

        bookingFormWrap.style.display = "none";

        bookingConfirmWrap.innerHTML = `
          <div class="confirm-box">

            <div class="ci">
              <i data-lucide="check" width="30" height="30"></i>
            </div>

            <h3>Booking Request Ready</h3>

            <p>
              Your booking details have been captured.
              Please connect the property's real email,
              WhatsApp number, or booking system to send
              this enquiry automatically.
            </p>

            <div style="
              text-align:left;
              background:var(--cream);
              padding:18px;
              border-radius:12px;
              margin:20px 0;
              font-size:.9rem;
            ">

              <strong>Name:</strong> ${escapeHTML(name)}<br>
              <strong>Check-in:</strong> ${escapeHTML(checkInDate)}<br>
              <strong>Check-out:</strong> ${escapeHTML(checkOutDate)}<br>
              <strong>Guests:</strong> ${escapeHTML(guests)}<br>
              <strong>Phone:</strong> ${escapeHTML(phone)}

              ${
                message
                  ? `<br><strong>Message:</strong> ${escapeHTML(message)}`
                  : ""
              }

            </div>

            <button
              class="btn btn-ghost"
              onclick="closeModal('bookingModal')"
            >
              Close
            </button>

          </div>
        `;

        bookingConfirmWrap.style.display = "block";

        if (window.lucide) {
          lucide.createIcons();
        }

        return;
      }


      /*
       * Real email sending through mail client.
       */

      const subject =
        encodeURIComponent(
          "Booking Enquiry - Simhagiri Holiday Inn"
        );

      const body =
        encodeURIComponent(
`Hello Simhagiri Holiday Inn,

I would like to enquire about a stay.

Name: ${name}
Phone: ${phone}
Check-in: ${checkInDate}
Check-out: ${checkOutDate}
Guests: ${guests}

Message:
${message || "No additional message."}

Please confirm availability and booking details.

Thank you.`
        );

      window.location.href =
        `mailto:${propertyEmail}?subject=${subject}&body=${body}`;
    }
  );


  /* =========================================================
     CONTACT MODAL
     ========================================================= */

  window.openContact = function () {

    document
      .getElementById("contactModal")
      .classList.add("open");

    document.body.style.overflow = "hidden";
  };


  /* ---------- Close modals by clicking outside ---------- */

  document
    .querySelectorAll(".modal-overlay")
    .forEach(overlay => {

      overlay.addEventListener(
        "click",
        function (event) {

          if (event.target === overlay) {

            closeModal(overlay.id);
          }
        }
      );
    });


  /* =========================================================
     ESCAPE KEY FOR MODALS
     ========================================================= */

  document.addEventListener(
    "keydown",
    function (event) {

      if (event.key !== "Escape") return;

      document
        .querySelectorAll(".modal-overlay.open")
        .forEach(modal => {
          closeModal(modal.id);
        });
    }
  );


  /* =========================================================
     SIMPLE HTML ESCAPE
     ========================================================= */

  function escapeHTML(value) {

    return String(value)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#039;");
  }


  /* =========================================================
     SMOOTH SCROLL
     ========================================================= */

  document
    .querySelectorAll('a[href^="#"]')
    .forEach(link => {

      link.addEventListener("click", function (event) {

        const targetId =
          this.getAttribute("href");

        if (
          !targetId ||
          targetId === "#"
        ) {
          return;
        }

        const target =
          document.querySelector(targetId);

        if (!target) return;

        event.preventDefault();

        target.scrollIntoView({
          behavior: "smooth",
          block: "start"
        });
      });
    });


  /* =========================================================
     RE-INITIALIZE ICONS
     ========================================================= */

  if (window.lucide) {
    lucide.createIcons();
  }

});
</script>
